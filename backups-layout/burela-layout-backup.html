<!doctype html><meta charset="utf-8"><title>Respaldo de layout</title>
<style>body{font:13px "Courier New",monospace;background:#0b0d0c;color:#f5f3e9;padding:24px;line-height:1.7}
b{color:#f0d96e}</style>
<h2>Respaldo de layout del editor</h2>
<pre id="out">leyendo…</pre>
<p><button id="dl" style="font:700 13px 'Courier New',monospace;padding:12px 20px;background:#f0d96e;border:0;border-radius:3px;cursor:pointer">DESCARGAR JSON DEL LAYOUT</button></p>
<script>
// Solo lee localStorage de ESTE origen. No carga el simulador ni migra nada.
const out = document.getElementById('out');
const lines = [];
lines.push('origen: ' + location.origin);
for (let i = 0; i < localStorage.length; i++) {
  const k = localStorage.key(i);
  const v = localStorage.getItem(k) || '';
  lines.push(`  ${k}  →  ${v.length} bytes`);
}
const layout = localStorage.getItem('fourtwenty-editor-layout-burela-retro');
if (layout) {
  try {
    const items = JSON.parse(layout);
    lines.push('', `LAYOUT: ${items.length} objetos`);
    const station = items.filter(x => JSON.stringify(x).toLowerCase().match(/tram|station|estacion/));
    lines.push('estación: ' + (station.length ? station.map(s => s.id + ' → ' + s.model).join(' | ') : 'NO HAY (fue reemplazada o borrada)'));
    const floors = items.filter(x => /^destino-\d+:/.test(x.id || ''));
    lines.push('objetos de pisos: ' + floors.length);
  } catch (e) { lines.push('no se pudo parsear: ' + e.message); }
} else {
  lines.push('', 'NO hay layout guardado en este origen.');
}
out.textContent = lines.join('\n');
window.__layoutRaw = layout;
document.getElementById('dl').onclick = () => {
  if (!layout) { alert('No hay layout en este origen.'); return; }
  const host = location.host.replace(/[:.]/g, '-');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([layout], { type: 'application/json' }));
  a.download = `layout-${host}.json`;
  a.click();
};
</script>
