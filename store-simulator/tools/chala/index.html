<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Chala Offline · Ingeniería Bobilonia</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <div class="chala-mark" aria-hidden="true"><span></span></div>
      <div>
        <strong>CHALA OFFLINE</strong>
        <small>Ingeniería privada de Bobilonia</small>
      </div>
    </div>
    <div class="status-line">
      <span class="status-dot"></span>
      <span>LOCAL · SIN API · SOLO LECTURA</span>
      <button id="refresh" type="button" title="Actualizar contexto desde los archivos locales">↻</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="context-panel">
      <section>
        <h2>Estado técnico</h2>
        <dl class="facts">
          <div><dt>Rama</dt><dd id="branch">Cargando…</dd></div>
          <div><dt>Commit</dt><dd id="commit">Cargando…</dd></div>
          <div><dt>Contexto</dt><dd id="generated">Cargando…</dd></div>
        </dl>
      </section>

      <section>
        <div class="section-heading">
          <h2>Recuerdos</h2>
          <button id="export-memories" type="button" title="Descargar recuerdos">↓</button>
        </div>
        <div id="memory-list" class="memory-list"></div>
      </section>

      <div class="aside-actions">
        <a href="http://127.0.0.1:5202/" target="_blank" rel="noopener">Abrir simulador</a>
        <button id="clear-memories" type="button">Limpiar recuerdos</button>
      </div>
    </aside>

    <section class="chat-panel" aria-label="Conversación con Chala">
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="quick-prompts" aria-label="Preguntas rápidas">
        <button type="button" data-prompt="¿En qué rama y versión estamos?">Rama y versión</button>
        <button type="button" data-prompt="¿Cuáles fueron las últimas modificaciones?">Últimos cambios</button>
        <button type="button" data-prompt="Buscá los archivos GLB de Bob">GLB de Bob</button>
        <button type="button" data-prompt="¿Qué dice el proyecto sobre Burela?">Burela</button>
        <button type="button" data-prompt="Listame todo lo que te pedí recordar">Mis recuerdos</button>
      </div>
      <form id="ask-form" class="composer">
        <label for="question">Consultá el proyecto o escribí “recordá que…”</label>
        <div>
          <textarea id="question" rows="2" placeholder="Ejemplo: ¿dónde está el modelo de Bob?" autocomplete="off"></textarea>
          <button type="submit" title="Preguntar">↑</button>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
