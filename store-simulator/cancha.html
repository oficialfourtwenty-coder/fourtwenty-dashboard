<!doctype html>
<html lang="es">
<head>

  <title>FOURTWENTY · cancha HOOP SEASON</title>

    :root { color-scheme: dark; }

    #vista { display: block; width: 100vw; height: 100vh; }
    .panel {
      position: fixed; z-index: 5; color: #e9e6df; pointer-events: none;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(10, 13, 18, 0.62); border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px; padding: 9px 12px; backdrop-filter: blur(6px);
    }
    #arriba { top: 14px; left: 14px; }
    #abajo  { bottom: 14px; left: 14px; }
    b { color: #39ff6a; font-weight: 600; }
    .tecla { color: #ffd27a; }
  </style>
</head>
<body>
  <canvas id="vista"></canvas>

  <div class="panel" id="arriba">
    <div>CANCHA HOOP SEASON · <b id="vista-nombre">—</b></div>
    <div id="medidor">midiendo…</div>
    <div id="flags">—</div>
  </div>

  <div class="panel" id="abajo">
    <span class="tecla">1-5</span> cámaras ·
    <span class="tecla">O</span> oclusión ·
    <span class="tecla">B</span> bloom ·
    <span class="tecla">V</span> sombras ·

    <span class="tecla">arrastrar</span> girar ·
    <span class="tecla">rueda</span> acercar
