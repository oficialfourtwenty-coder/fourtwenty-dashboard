<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOURTWENTY — Store Simulator</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a140e; }
  #game {
    width: 100%; height: 100%; display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'Courier New', monospace; }
  .hud-title {
    position: absolute; top: 14px; left: 16px;
    color: #f2e8c9; font-size: 13px; font-weight: bold; letter-spacing: 3px;
    text-shadow: 2px 2px 0 #00000088;
  }
  .hud-floor {
    position: absolute; top: 14px; right: 16px;
    color: #d4af37; font-size: 13px; font-weight: bold; letter-spacing: 2px;
    text-shadow: 2px 2px 0 #00000088;
  }
  .hud-help {
    position: absolute; bottom: 12px; left: 16px;
    color: #f2e8c9aa; font-size: 11px; letter-spacing: 1px;
    text-shadow: 1px 1px 0 #00000088;
  }
  #start-overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #12100bdd; color: #f2e8c9; cursor: pointer;
    font-family: 'Courier New', monospace; text-align: center;
  }
  #start-overlay h1 { font-size: 22px; letter-spacing: 6px; margin: 0; color: #f2e8c9; }
  #start-overlay p  { font-size: 12px; letter-spacing: 2px; margin: 0; color: #d4af37; }
  #start-overlay .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hud-title">FOURTWENTY</div>
  <div class="hud-floor" id="hud-floor">PISO 1</div>
  <div class="hud-help">WASD MOVER &nbsp;·&nbsp; SHIFT CORRER &nbsp;·&nbsp; MOUSE CÁMARA &nbsp;·&nbsp; ESC SOLTAR MOUSE</div>
</div>
<div id="start-overlay">
  <h1>FOURTWENTY</h1>
  <p>STORE SIMULATOR — LOCAL EN OBRA</p>
  <p class="blink">CLICK PARA ENTRAR</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
